<!DOCTYPE html>
<!--
  DETECTOR DE AJÍES (Chrome en Android). Reconoce la tarjeta ArUco con la cámara del teléfono y envía "N:x\n"
  (x = nivel 0-10) a un Arduino Leonardo o Micro conectado al teléfono por cable, con un adaptador OTG (como en R2).
  Sketch del Arduino: arduino/receptor_webusb (lleva la librería WebUSB; las instrucciones están en ese archivo).

  CÓMO USARLA
  - Pongan este index.html y ajies.json en la MISMA carpeta (la tabla de ajíes se edita en ajies.json).
  - La cámara solo funciona con HTTPS o en localhost. Con doble clic (file://) NO funciona.
      · En el computador: en esta carpeta corran  python -m http.server 8000  y abran http://localhost:8000
      · En el teléfono: súbanla a un hosting con HTTPS (GitHub Pages, Netlify, etc.) y ábranla en Chrome.
  - Marquen "Modo sin Arduino" para probar solo la detección: se ve en pantalla lo que se habría enviado.

  ERRORES COMUNES
  - "No se pudo abrir la cámara": den permiso de cámara (candado junto a la dirección > Permisos) y
    revisen que la página esté en https:// o localhost.
  - Botón desactivado: WebUSB no existe en iPhone/iPad (ningún navegador), Safari ni Firefox.
    Usen Chrome en Android (o Chrome/Edge en el computador).
  - No aparece la placa en la lista: revisen el adaptador OTG y que el cable transmita datos (no solo carga).
  - "La placa no tiene la interfaz WebUSB": no se cargó receptor_webusb, o es un Uno (el Uno no sirve).
  - Si sigue cargado el firmware de Protobject de R2, se conecta pero el Arduino ignora los mensajes: suban receptor_webusb.
  - "Tabla no cargada": ajies.json no está junto a index.html o tiene un error de formato (falta una coma, etc.).
-->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detector de ajíes</title>

  <!-- Librería js-aruco2 (detecta marcadores ArUco). El orden importa: cv.js, aruco.js y luego el diccionario.
       Su diccionario ARUCO_4X4_1000 viene de OpenCV, y los IDs 0-49 son idénticos a DICT_4X4_50
       (OpenCV usa la misma lista para 4x4_50/100/250/1000). Por eso sirven los marcadores de chev.me en "4x4". -->
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/dictionaries/aruco_4x4_1000.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #f2f2f2;
    }
    main { max-width: 720px; margin: 0 auto; padding: 12px; }
    h1 { font-size: 1.2rem; margin: 4px 0 10px; }

    /* El video se dibuja en este canvas (con el contorno del marcador encima) */
    canvas { width: 100%; border-radius: 8px; background: #000; display: block; }
    video { display: none; }

    .panel {
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      background: #2a2a2a;
    }
    .nombre { font-size: 1.6rem; font-weight: bold; }
    .dato { color: #bbb; margin-top: 4px; }
    .estado { color: #999; font-size: 0.9rem; margin-top: 6px; }

    /* Barra de nivel 0-10: el ancho y el color se cambian desde JavaScript */
    .barra-fondo { height: 22px; border-radius: 11px; background: #444; margin-top: 10px; overflow: hidden; }
    .barra { height: 100%; width: 0%; background: hsl(120, 80%, 45%); transition: width 0.3s, background 0.3s; }

    .controles { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
    button {
      font-size: 1rem;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #d9480f;
      color: white;
    }
    button:disabled { background: #555; color: #999; }
    button.conectado { background: #2b8a3e; }
    label { display: flex; align-items: center; gap: 6px; }

    #registro {
      margin-top: 10px;
      padding: 8px;
      height: 140px;
      overflow-y: auto;
      border-radius: 8px;
      background: #111;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
    .aviso { color: #ffa94d; }
  </style>
</head>
<body>
<main>
  <h1>🌶️ Detector de ajíes (ArUco 4x4_50)</h1>

  <video id="video" playsinline muted></video>
  <canvas id="lienzo"></canvas>

  <section class="panel">
    <div class="nombre" id="txtNombre">Ninguna tarjeta</div>
    <div class="dato" id="txtDetalle">Muestra una tarjeta a la cámara</div>
    <div class="barra-fondo"><div class="barra" id="barra"></div></div>
    <div class="estado" id="txtEstado">Cargando…</div>
  </section>

  <div class="controles">
    <button id="btnUSB" type="button">Conectar Arduino (cable USB)</button>
    <label><input type="checkbox" id="chkSinArduino" /> Modo sin Arduino</label>
  </div>

  <div id="registro"></div>
</main>

<script>
// =====================================================================
// CONFIGURACIÓN (cambien aquí si hace falta)
// =====================================================================

// Placas que aparecen en la lista al conectar por cable USB (WebUSB).
// vendorId = fabricante. Leonardo = producto 0x8036, Micro = 0x8037 (son las placas que acepta Protobject en R2).
const FILTROS_USB = [
  { vendorId: 0x2341 },   // Arduino (Leonardo, Micro, MKR, Zero...)
  { vendorId: 0x2a03 },   // Arduino (placas antiguas de arduino.org)
  { vendorId: 0x239a },   // Adafruit
  { vendorId: 0x1b4f }    // SparkFun (Pro Micro)
];

const CUADROS_PARA_ACEPTAR = 4;   // cuadros seguidos con el mismo ID antes de aceptarlo (3-5)
const MS_SIN_TARJETA = 1500;      // milisegundos sin marcador antes de enviar "N:0"
const ANCHO_PROCESO = 640;        // ancho (px) al que se reduce la imagen para detectar (más chico = más rápido)

// =====================================================================
// VARIABLES DEL PROGRAMA
// =====================================================================

let tablaAjies = {};   // { id: { nombre, shu } }, se llena desde ajies.json
let shuMax = 1;        // SHU que corresponde al nivel 10

// Estado de la detección
let candidatoId = null;       // ID que se está viendo ahora
let cuadrosSeguidos = 0;      // cuántos cuadros seguidos lleva ese ID
let idAceptado = null;        // ID ya confirmado (el que se muestra)
let ultimaDeteccion = performance.now();
let nivelEnviado = null;      // último nivel enviado (para enviar solo cuando cambia)

// Estado del cable USB
let dispositivoUSB = null;    // la placa conectada por cable (null = no conectada)
let numeroInterfaz = 0;       // "canal" WebUSB de la placa
let endpointSalida = 0;       // por donde se envían los datos a la placa
let endpointEntrada = 0;      // por donde llegan las respuestas de la placa

let colaEscritura = Promise.resolve();  // para no escribir dos mensajes al mismo tiempo

// Elementos de la página
const video = document.getElementById("video");
const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d", { willReadFrequently: true });
const btnUSB = document.getElementById("btnUSB");
const chkSinArduino = document.getElementById("chkSinArduino");

// Detector ArUco (maxHammingDistance: 1 = solo acepta coincidencias exactas, menos falsos positivos)
const detector = new AR.Detector({ dictionaryName: "ARUCO_4X4_1000", maxHammingDistance: 1 });

// =====================================================================
// 1. CARGAR LA TABLA DE AJÍES (ajies.json)
// =====================================================================

async function cargarTabla() {
  const respuesta = await fetch("ajies.json", { cache: "no-store" });
  const datos = await respuesta.json();

  tablaAjies = {};
  let mayorShu = 0;
  for (const aji of datos.ajies) {
    tablaAjies[aji.id] = { nombre: aji.nombre, shu: aji.shu };
    mayorShu = Math.max(mayorShu, aji.shu);
  }
  // Si ajies.json trae "shu_max" se usa ese; si no, el SHU más alto de la tabla
  shuMax = datos.shu_max || mayorShu || 1;
  registrar(`Tabla cargada: ${datos.ajies.length} ajíes, SHU máximo = ${shuMax.toLocaleString("es-CL")}`);
}

// =====================================================================
// 2. NIVEL DE PICOR (escala logarítmica, 0 a 10)
// =====================================================================

function calcularNivel(shu) {
  const nivel = Math.round(10 * Math.log10(shu + 1) / Math.log10(shuMax + 1));
  return Math.max(0, Math.min(10, nivel));  // por si algún SHU supera shu_max
}

// =====================================================================
// 3. CÁMARA
// =====================================================================

async function iniciarCamara() {
  if (!navigator.mediaDevices || !window.isSecureContext) {
    throw new Error("La cámara necesita HTTPS o localhost (la página no está en un contexto seguro).");
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();

  // Tamaño del canvas: ANCHO_PROCESO de ancho, manteniendo la proporción del video
  const escala = Math.min(1, ANCHO_PROCESO / video.videoWidth);
  lienzo.width = Math.round(video.videoWidth * escala);
  lienzo.height = Math.round(video.videoHeight * escala);
}

// Bucle principal: se ejecuta en cada cuadro del video
function procesarCuadro() {
  // a) Dibujar el cuadro actual y leer sus píxeles
  ctx.drawImage(video, 0, 0, lienzo.width, lienzo.height);
  const imagen = ctx.getImageData(0, 0, lienzo.width, lienzo.height);

  // b) Detectar marcadores
  const marcadores = detector.detect(imagen);

  // c) Dibujar contornos; los IDs que no están en la tabla salen en gris y se ignoran
  for (const m of marcadores) {
    dibujarMarcador(m, tablaAjies[m.id] ? "#40c057" : "#888");
  }
  const validos = marcadores.filter(m => tablaAjies[m.id]);

  // d) Lógica de estabilidad
  const ahora = performance.now();
  if (validos.length > 0) {
    // Si hay varias tarjetas, usamos la más grande (la más cercana a la cámara)
    validos.sort((a, b) => area(b.corners) - area(a.corners));
    const id = validos[0].id;
    ultimaDeteccion = ahora;

    if (id === candidatoId) {
      cuadrosSeguidos++;
    } else {
      candidatoId = id;
      cuadrosSeguidos = 1;
    }

    // Se acepta el ID cuando lleva suficientes cuadros seguidos
    if (cuadrosSeguidos >= CUADROS_PARA_ACEPTAR && id !== idAceptado) {
      idAceptado = id;
      const aji = tablaAjies[id];
      const nivel = calcularNivel(aji.shu);
      mostrarAji(id, aji, nivel);
      enviarNivel(nivel);
    }
    if (id !== idAceptado) {
      ponerEstado(`Detectando ID ${id}… (${cuadrosSeguidos}/${CUADROS_PARA_ACEPTAR})`);
    }
  } else {
    // Ningún marcador en este cuadro
    candidatoId = null;
    cuadrosSeguidos = 0;
    if (ahora - ultimaDeteccion > MS_SIN_TARJETA && nivelEnviado !== 0) {
      idAceptado = null;
      mostrarNada();
      enviarNivel(0);
    }
  }

  requestAnimationFrame(procesarCuadro);
}

// Dibuja el contorno de un marcador y su ID
function dibujarMarcador(marcador, color) {
  const c = marcador.corners;
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(c[0].x, c[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
  ctx.closePath();
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.font = "bold 22px sans-serif";
  ctx.fillText("ID " + marcador.id, c[0].x, c[0].y - 8);
}

// Área aproximada de un marcador (fórmula del polígono)
function area(c) {
  let suma = 0;
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4;
    suma += c[i].x * c[j].y - c[j].x * c[i].y;
  }
  return Math.abs(suma) / 2;
}

// =====================================================================
// 4. MOSTRAR EN PANTALLA
// =====================================================================

function mostrarAji(id, aji, nivel) {
  document.getElementById("txtNombre").textContent = aji.nombre;
  document.getElementById("txtDetalle").textContent =
    `ID ${id} · ${aji.shu.toLocaleString("es-CL")} SHU · Nivel ${nivel}/10`;
  pintarBarra(nivel);
  ponerEstado(`Tarjeta aceptada: ID ${id}`);
}

function mostrarNada() {
  document.getElementById("txtNombre").textContent = "Ninguna tarjeta";
  document.getElementById("txtDetalle").textContent = "Muestra una tarjeta a la cámara";
  pintarBarra(0);
  ponerEstado("Sin tarjeta → nivel 0");
}

// Barra de verde (nivel 0, tono 120) a rojo (nivel 10, tono 0)
function pintarBarra(nivel) {
  const barra = document.getElementById("barra");
  barra.style.width = (nivel * 10) + "%";
  barra.style.background = `hsl(${120 - nivel * 12}, 80%, 45%)`;
}

function ponerEstado(texto) {
  document.getElementById("txtEstado").textContent = texto;
}

// Agrega una línea al registro de abajo (las más nuevas arriba, máximo 50)
function registrar(texto, esAviso = false) {
  const reg = document.getElementById("registro");
  const linea = document.createElement("div");
  if (esAviso) linea.className = "aviso";
  linea.textContent = new Date().toLocaleTimeString("es-CL") + "  " + texto;
  reg.prepend(linea);
  while (reg.children.length > 50) reg.lastChild.remove();
}

// =====================================================================
// 5. ENVIAR EL NIVEL ("N:x\n")
// =====================================================================

function enviarNivel(nivel) {
  if (nivel === nivelEnviado) return;  // solo se envía cuando cambia
  nivelEnviado = nivel;
  const mensaje = `N:${nivel}\n`;

  if (chkSinArduino.checked) {
    registrar(`(sin Arduino) habría enviado: N:${nivel}`);
  } else if (dispositivoUSB) {
    escribirArduino(mensaje);
  } else {
    registrar(`N:${nivel} no se envió: Arduino no conectado`, true);
  }
}

// Escribe el texto en el Arduino por el cable USB, un mensaje a la vez
function escribirArduino(texto) {
  const datos = new TextEncoder().encode(texto);
  colaEscritura = colaEscritura
    .then(async () => {
      if (!dispositivoUSB) return;   // se desconectó mientras esperaba
      await dispositivoUSB.transferOut(endpointSalida, datos);
      registrar("Enviado: " + texto.trim());
    })
    .catch(error => registrar("Error al enviar: " + error.message, true));
}

// =====================================================================
// 6. CONEXIÓN POR CABLE USB (WebUSB)
//    Igual que el demo oficial de la librería WebUSB para Arduino (webusb.github.io/arduino)
// =====================================================================

async function conectarUSB() {
  try {
    dispositivoUSB = await navigator.usb.requestDevice({ filters: FILTROS_USB });  // abre la lista de placas
    btnUSB.textContent = "Conectando…";
    await dispositivoUSB.open();
    if (dispositivoUSB.configuration === null) {
      await dispositivoUSB.selectConfiguration(1);
    }

    // Buscar la interfaz WebUSB de la placa (es la de clase 0xFF, "del fabricante")
    let interfaz = null;
    for (const i of dispositivoUSB.configuration.interfaces) {
      if (i.alternates[0].interfaceClass === 0xff) interfaz = i;
    }
    if (!interfaz) {
      throw new Error("La placa no tiene la interfaz WebUSB. ¿Cargaron receptor_webusb? (El Uno no sirve por cable.)");
    }
    numeroInterfaz = interfaz.interfaceNumber;
    for (const e of interfaz.alternates[0].endpoints) {
      if (e.direction === "out") endpointSalida = e.endpointNumber;
      if (e.direction === "in") endpointEntrada = e.endpointNumber;
    }

    await dispositivoUSB.claimInterface(numeroInterfaz);
    await dispositivoUSB.selectAlternateInterface(numeroInterfaz, 0);
    // "Abrir el puerto": le avisa a la placa que hay alguien conectado (como abrir el Monitor Serial)
    await dispositivoUSB.controlTransferOut({
      requestType: "class", recipient: "interface", request: 0x22, value: 0x01, index: numeroInterfaz
    });

    btnUSB.textContent = "✅ Cable: " + (dispositivoUSB.productName || "Arduino");
    btnUSB.classList.add("conectado");
    registrar("Conectado por cable a " + (dispositivoUSB.productName || "Arduino"));
    leerUSB();

    // Al conectar, enviamos el nivel actual para que el Arduino quede sincronizado
    if (!chkSinArduino.checked) escribirArduino(`N:${nivelEnviado ?? 0}\n`);
  } catch (error) {
    // Si el usuario cierra la lista sin elegir, también llega aquí (NotFoundError)
    registrar("No se pudo conectar por cable: " + error.message, true);
    if (dispositivoUSB && dispositivoUSB.opened) dispositivoUSB.close().catch(() => {});
    dispositivoUSB = null;
    btnUSB.textContent = "Conectar Arduino (cable USB)";
  }
}

// Lee lo que responde la placa ("Nivel recibido: x") y lo muestra en el registro
async function leerUSB() {
  const decodificador = new TextDecoder();
  let pendiente = "";
  while (dispositivoUSB && dispositivoUSB.opened) {
    try {
      const resultado = await dispositivoUSB.transferIn(endpointEntrada, 64);
      pendiente += decodificador.decode(resultado.data);
      const lineas = pendiente.split("\n");
      pendiente = lineas.pop();   // lo que queda sin "\n" espera al próximo trozo
      for (const linea of lineas) {
        if (linea.trim()) registrar("Arduino dice: " + linea.trim());
      }
    } catch (error) {
      break;   // la placa se desconectó
    }
  }
}

async function desconectarUSB() {
  try {
    await dispositivoUSB.controlTransferOut({
      requestType: "class", recipient: "interface", request: 0x22, value: 0x00, index: numeroInterfaz
    });
    await dispositivoUSB.close();
  } catch (error) { /* ya estaba desconectada */ }
  alDesconectarUSB();
}

function alDesconectarUSB() {
  dispositivoUSB = null;
  btnUSB.textContent = "Conectar Arduino (cable USB)";
  btnUSB.classList.remove("conectado");
  registrar("Arduino (cable) desconectado", true);
}

btnUSB.addEventListener("click", () => {
  if (dispositivoUSB) {
    desconectarUSB();   // si ya está conectado, el botón desconecta
  } else {
    conectarUSB();
  }
});

// Si se desenchufa el cable
if (navigator.usb) {
  navigator.usb.addEventListener("disconnect", evento => {
    if (evento.device === dispositivoUSB) alDesconectarUSB();
  });
}

chkSinArduino.addEventListener("change", () => {
  registrar(chkSinArduino.checked ? "Modo sin Arduino ACTIVADO" : "Modo sin Arduino desactivado");
  // Al volver al modo normal con el Arduino conectado, le enviamos el nivel actual
  if (!chkSinArduino.checked && dispositivoUSB) escribirArduino(`N:${nivelEnviado ?? 0}\n`);
});

// =====================================================================
// 7. INICIO
// =====================================================================

async function iniciar() {
  // WebUSB no existe en iPhone/Safari/Firefox: se desactiva el botón y se usa el modo sin Arduino
  if (!navigator.usb) {
    btnUSB.disabled = true;
    btnUSB.textContent = "Cable USB no disponible aquí";
    chkSinArduino.checked = true;
    registrar("Este navegador no puede conectarse al Arduino (iPhone/Safari/Firefox). Usen Chrome en Android. Modo sin Arduino activado.", true);
  }

  try {
    await cargarTabla();
  } catch (error) {
    ponerEstado("❌ Tabla no cargada: revisen que ajies.json esté junto a index.html y sea válido.");
    registrar("Error al leer ajies.json: " + error.message, true);
    return;
  }

  try {
    await iniciarCamara();
  } catch (error) {
    ponerEstado("❌ No se pudo abrir la cámara: " + error.message);
    registrar("Cámara: den permiso de cámara y abran la página por HTTPS o localhost. (" + error.name + ")", true);
    return;
  }

  // Mantener la pantalla encendida mientras se usa (si el navegador lo permite)
  try { await navigator.wakeLock.request("screen"); } catch (e) { /* no es importante */ }

  ponerEstado("Listo. Muestra una tarjeta a la cámara.");
  ultimaDeteccion = performance.now();
  requestAnimationFrame(procesarCuadro);
}

iniciar();
</script>
</body>
</html>
